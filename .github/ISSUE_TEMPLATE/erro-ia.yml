name: Erro da IA
description: A IA fez algo errado, inventou, ignorou uma regra ou passou do escopo
title: "[erro-ia] "
labels: ["erro-ia"]
body:
  - type: markdown
    attributes:
      value: |
        Registre o que a IA fez, sem suavizar. Com a causa raiz descoberta, o erro vira um `ERR-NNN`
        (`docs/erros/`, skill `/registrar-erro`), com a "Lição para a IA".
  - type: textarea
    id: o-que-fez
    attributes:
      label: O que a IA fez
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: Saída, commit, trecho da conversa. Só o que a sessão mostrou.
    validations:
      required: true
  - type: input
    id: regra
    attributes:
      label: Regra violada (se houver)
      placeholder: "Exemplo: CLAUDE.md §5 (não invente API)"
  - type: dropdown
    id: severidade
    attributes:
      label: Severidade
      options:
        - baixa
        - media
        - alta
        - critica
    validations:
      required: true
